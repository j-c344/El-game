<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cosmic Breakout — EL GAME</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#160e24;color:white;text-align:center;font:16px Arial;touch-action:manipulation}h2{margin:4px}.hud{display:flex;justify-content:center;gap:20px;color:#e9c7ff}canvas{display:block;width:min(95vw,440px);height:auto;margin:12px auto;background:#0e0a17;border:2px solid #b858d8;border-radius:12px;touch-action:none}button{min-height:44px;padding:10px 16px;background:#54256a;color:white;border:1px solid #d27cec;border-radius:10px;font-size:16px}</style></head><body><h2>🪐 COSMIC BREAKOUT</h2><div class="hud"><span id="score">Score : 0</span><span id="level">Niveau 1</span></div><canvas id="c" width="400" height="520" aria-label="Casse-briques. Glisse pour déplacer la raquette"></canvas><p id="msg">Glisse pour bouger. Les briques dorées donnent un bonus.</p><button id="restart">Recommencer</button><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');let paddle=160,ball,bricks=[],score=0,level=1,live=true;function makeLevel(){bricks=[];const rows=Math.min(3+level,7);for(let r=0;r<rows;r++)for(let col=0;col<8;col++)bricks.push({x:8+col*48,y:42+r*24,w:42,h:16,alive:true,gold:(r+col+level)%7===0})}function reset(){score=0;level=1;paddle=160;ball={x:200,y:400,dx:3,dy:-4,r:8};live=true;makeLevel();document.querySelector('#msg').textContent='Glisse pour déplacer la raquette.';draw();requestAnimationFrame(loop)}function move(e){const r=c.getBoundingClientRect(),x=e.clientX??e.touches?.[0]?.clientX;if(x!=null)paddle=Math.max(0,Math.min(320,(x-r.left)*400/r.width-40))}c.addEventListener('pointermove',move);c.addEventListener('pointerdown',move);function draw(){ctx.clearRect(0,0,400,520);bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.gold?'#ffcf5a':`hsl(${270+b.y/3} 65% 58%)`;ctx.fillRect(b.x,b.y,b.w,b.h)}});ctx.fillStyle='#8ee8ff';ctx.fillRect(paddle,490,80,12);ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}function loop(){if(!live)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<ball.r||ball.x>400-ball.r)ball.dx*=-1;if(ball.y<ball.r)ball.dy=Math.abs(ball.dy);if(ball.y+ball.r>=490&&ball.y<510&&ball.x>=paddle&&ball.x<=paddle+80){ball.dy=-Math.abs(ball.dy);ball.dx+=(ball.x-(paddle+40))*.06}for(const b of bricks){if(b.alive&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.alive=false;ball.dy*=-1;score+=b.gold?5:1;document.querySelector('#score').textContent=`Score : ${score}`;if(b.gold){ball.dx*=1.08;ball.dy*=1.08}break}}if(bricks.every(b=>!b.alive)){level++;document.querySelector('#level').textContent=`Niveau ${level}`;makeLevel();ball.dx*=1.08;ball.dy*=1.08}if(ball.y>530){live=false;document.querySelector('#msg').textContent='Fin de partie !';if(score)parent.postMessage({type:'el-game-score',game:'breakout',score},location.origin)}draw();if(live)requestAnimationFrame(loop)}document.querySelector('#restart').onclick=reset;reset();
</script></body></html>
