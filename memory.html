<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;background:#171022;color:white;font:16px Arial;text-align:center"><h2>MEMORY MATCH</h2><p>Retrouve toutes les paires !</p><div id="g" style="display:grid;grid-template-columns:repeat(4,minmax(55px,80px));gap:9px;justify-content:center"></div><p id="msg"></p><button onclick="init()">Recommencer</button><script>const icons=['🌙','⭐','🎮','🍀','🔥','💎','🚀','👾'];let first=null,lock=false,done=0;function init(){first=null;lock=false;done=0;document.getElementById('msg').textContent='';let a=[...icons,...icons].sort(()=>Math.random()-.5);document.getElementById('g').innerHTML=a.map((v,i)=>`<button data-v="${v}" style="height:75px;font-size:28px;background:#34254c;border:1px solid #7652a3;border-radius:12px">?</button>`).join('');document.querySelectorAll('#g button').forEach(b=>b.onclick=()=>{if(lock||b.textContent!=='?')return;b.textContent=b.dataset.v;if(!first){first=b;return}if(first.dataset.v===b.dataset.v){done+=2;first=null;if(done===16)document.getElementById('msg').textContent='Bravo ! 🎉'}else{lock=true;let f=first;first=null;setTimeout(()=>{f.textContent='?';b.textContent='?';lock=false},700)}})}init();</script></body></html>
