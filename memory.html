<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Memory Match — EL GAME</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#171022;color:#fff;text-align:center;font:16px Arial}h2{margin:5px}.stats{display:flex;justify-content:center;gap:22px;color:#e0c3ff;flex-wrap:wrap}.grid{width:min(94vw,540px);margin:18px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{aspect-ratio:1;border:1px solid #9a5bd4;border-radius:12px;background:#37204d;color:white;font-size:clamp(23px,8vw,42px);touch-action:manipulation}.card.open,.card.matched{background:#7544a0}.card.matched{opacity:.55}.actions button{min-height:44px;border-radius:10px;border:1px solid #b78be6;background:#512d70;color:white;padding:10px 16px;font-size:16px}.message{min-height:24px;color:#e0c3ff}</style></head><body><h2>🧠 MEMORY MATCH</h2><p class="stats"><span id="level">Niveau 1</span><span id="moves">Coups : 0</span><span id="score">Score : 0</span></p><p id="msg" class="message">Retrouve toutes les paires.</p><div id="grid" class="grid"></div><div class="actions"><button id="restart">Recommencer</button></div><script>
const symbols=['🌙','🎯','🍮','🎈','🐸','🔥','🧩','🌈','🦋','🍀','⭐','🐳'];let level=1,moves=0,score=0,matched=0,first=null,locked=false,timer=null,deck=[];const grid=document.querySelector('#grid');function start(){clearTimeout(timer);const pairs=Math.min(6+level-1,12);moves=0;matched=0;first=null;locked=false;deck=[...symbols.slice(0,pairs),...symbols.slice(0,pairs)].sort(()=>Math.random()-.5);document.querySelector('#level').textContent=`Niveau ${level}`;document.querySelector('#moves').textContent='Coups : 0';document.querySelector('#score').textContent=`Score : ${score}`;document.querySelector('#msg').textContent=`Trouve ${pairs} paires.`;grid.innerHTML='';deck.forEach((v,i)=>{const b=document.createElement('button');b.className='card';b.textContent='?';b.setAttribute('aria-label',`Carte ${i+1}, cachée`);b.onclick=()=>flip(b,i);grid.appendChild(b)})}function flip(button,index){if(locked||button.classList.contains('open')||button.classList.contains('matched'))return;button.textContent=deck[index];button.classList.add('open');if(!first){first={button,index};return}moves++;document.querySelector('#moves').textContent=`Coups : ${moves}`;if(deck[first.index]===deck[index]){first.button.classList.add('matched');button.classList.add('matched');matched++;first=null;if(matched===deck.length/2){score+=Math.max(10,100+level*20-moves*3);document.querySelector('#score').textContent=`Score : ${score}`;if(level<12){document.querySelector('#msg').textContent='Niveau réussi ! Le suivant commence…';level++;timer=setTimeout(start,1000)}else{document.querySelector('#msg').textContent='Bravo, tous les niveaux terminés !';parent.postMessage({type:'el-game-score',game:'memory',score},location.origin)}}}else{locked=true;const previous=first;first=null;setTimeout(()=>{previous.button.textContent='?';button.textContent='?';previous.button.classList.remove('open');button.classList.remove('open');locked=false},700)}}document.querySelector('#restart').onclick=()=>{level=1;score=0;start()};start();
</script></body></html>
