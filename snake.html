<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b1b"><title>Neon Snake — EL GAME</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101b1b;color:white;font:16px Arial,sans-serif;text-align:center;padding:12px;touch-action:manipulation}h2{margin:8px}.hud{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;color:#b9f4d0}canvas{display:block;width:min(92vw,440px);height:auto;max-height:58vh;margin:12px auto;border:2px solid #39c98a;border-radius:12px;background:#071713;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:6px;margin:8px auto}.controls button,button{background:#195c46;color:white;border:1px solid #49d197;border-radius:10px;padding:12px;min-height:44px;font-size:18px}.controls button:first-child{grid-column:2}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-row:2}#msg{min-height:24px;color:#a6f1c5}button{touch-action:manipulation}</style></head><body><h2>🐍 NEON SNAKE</h2><div class="hud"><span id="score">⭐ 0</span><span id="level">Niveau 1</span></div><canvas id="c" width="400" height="400" aria-label="Plateau de Snake"></canvas><p id="msg">Utilise les flèches ou glisse sur le plateau.</p><div class="controls"><button data-dir="up" aria-label="Haut">▲</button><button data-dir="left" aria-label="Gauche">◀</button><button data-dir="down" aria-label="Bas">▼</button><button data-dir="right" aria-label="Droite">▶</button></div><button id="start">Jouer / recommencer</button><script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),n=20,scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),msg=document.querySelector('#msg');let snake,dir,next,food,bonus,score=0,level=1,timer,playing=false,bonusUntil=0;
function randomCell(){let p;do{p={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}function draw(){ctx.clearRect(0,0,400,400);ctx.fillStyle='#0b211a';ctx.fillRect(0,0,400,400);ctx.fillStyle='#3bd38c';snake?.forEach((p,i)=>{ctx.fillStyle=i?'#23a96e':'#8af5bd';ctx.fillRect(p.x*20+2,p.y*20+2,16,16)});ctx.fillStyle='#ff6969';if(food)ctx.fillRect(food.x*20+3,food.y*20+3,14,14);if(bonus&&Date.now()<bonusUntil){ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(bonus.x*20+10,bonus.y*20+10,8,0,7);ctx.fill()}}
function setDir(name){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[name];if(d&&!(d[0]===-dir.x&&d[1]===-dir.y))next={x:d[0],y:d[1]}}
function end(){playing=false;clearInterval(timer);msg.textContent='Partie terminée ! Appuie sur recommencer.';if(score>0)parent.postMessage({type:'el-game-score',game:'snake',score},location.origin)}function tick(){if(!playing)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.slice(0,-1).some(p=>p.x===h.x&&p.y===h.y)){end();draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;if(score%5===0){level++;clearInterval(timer);timer=setInterval(tick,Math.max(55,135-(level-1)*10));levelEl.textContent=`Niveau ${level}`}food=randomCell();if(score%3===0){bonus=randomCell();bonusUntil=Date.now()+5000}}else snake.pop();if(bonus&&Date.now()<bonusUntil&&h.x===bonus.x&&h.y===bonus.y){score+=3;bonus=null}else if(Date.now()>bonusUntil)bonus=null;scoreEl.textContent=`⭐ ${score}`;draw()}
function start(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=next={x:1,y:0};score=0;level=1;food={x:15,y:10};bonus=null;playing=true;scoreEl.textContent='⭐ 0';levelEl.textContent='Niveau 1';msg.textContent='Attrape les fruits : un fruit bonus vaut 3 points !';draw();timer=setInterval(tick,135)}document.querySelector('#start').onclick=start;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>setDir(b.dataset.dir));onkeydown=e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}};let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});draw();
</script></body></html>
