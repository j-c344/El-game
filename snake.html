<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;background:#101b1b;color:white;font:16px Arial;text-align:center"><h2>NEON SNAKE</h2><p>Flèches ou glisse sur l'écran pour bouger</p><canvas id="c" width="400" height="400" style="width:min(92vw,400px);background:#071111;border:2px solid #36d6a0"></canvas><p id="s">Score : 0</p><button onclick="start()">Recommencer</button><script>
const c=document.getElementById('c'),x=c.getContext('2d'),n=20;let snake,dir,food,score,timer;function start(){clearInterval(timer);snake=[{x:10,y:10}];dir={x:1,y:0};food={x:5,y:5};score=0;tick();timer=setInterval(tick,120)}function tick(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.random()*n|0,y:Math.random()*n|0}}else snake.pop();x.clearRect(0,0,400,400);x.fillStyle='#36d6a0';snake.forEach(p=>x.fillRect(p.x*20+1,p.y*20+1,18,18));x.fillStyle='#ff6ab5';x.fillRect(food.x*20+2,food.y*20+2,16,16);document.getElementById('s').textContent='Score : '+score}onkeydown=e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d&&!(d[0]===-dir.x&&d[1]===-dir.y))dir={x:d[0],y:d[1]}};let sx=0,sy=0;c.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};c.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){dir={x:Math.sign(dx),y:0}}else dir={x:0,y:Math.sign(dy)}};start();</script></body></html>
