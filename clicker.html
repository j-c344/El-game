<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Space Clicker — EL GAME</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#10152d;color:white;font:16px Arial;text-align:center}h2{margin:5px}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.stats span,.shop article{background:#1c2447;border:1px solid #384477;border-radius:12px;padding:11px}.rocket{display:grid;place-items:center;margin:15px auto;width:min(55vw,180px);aspect-ratio:1;border:3px solid #768bff;border-radius:50%;background:radial-gradient(#303e85,#172044);font-size:70px;touch-action:manipulation;user-select:none;cursor:pointer;box-shadow:0 0 28px #687dff55}.rocket:active{transform:scale(.94)}button{min-height:44px;background:#354b9e;color:white;border:1px solid #8194ff;border-radius:10px;padding:10px 14px;font-size:15px;touch-action:manipulation}.shop{max-width:520px;margin:12px auto;display:grid;gap:8px}.shop article{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}.shop small{display:block;color:#bbc5ff;margin-top:3px}.message{min-height:20px;color:#cbd2ff}</style></head><body><h2>🚀 SPACE CLICKER</h2><div class="stats"><span id="stars">⭐ 0</span><span id="level">Niveau 1</span><span id="power">Par clic : 1</span></div><button id="tap" class="rocket" aria-label="Gagner des étoiles">🚀</button><p class="message" id="msg">Tape pour récolter des étoiles. Les étoiles du jeu restent séparées du score envoyé.</p><h3>Améliorations</h3><div id="shop" class="shop"></div><button id="reset">Nouvelle partie</button><script>
let total=0,balance=0,clickPower=1,passive=0,level=1,clickLevel=0,autoLevel=0,saveTimer;const prices=()=>({click:Math.floor(20*Math.pow(1.7,clickLevel)),auto:Math.floor(50*Math.pow(1.8,autoLevel))});function render(){document.querySelector('#stars').textContent=`⭐ ${balance}`;document.querySelector('#level').textContent=`Niveau ${level}`;document.querySelector('#power').textContent=`Par clic : ${clickPower}`;const p=prices();document.querySelector('#shop').innerHTML=`<article><span>✨ Boost de clic<small>+1 étoile par tape · possédé ${clickLevel}</small></span><button data-buy="click">Acheter · ${p.click} ⭐</button></article><article><span>🛰️ Sonde automatique<small>+1 étoile/sec · possédée ${autoLevel}</small></span><button data-buy="auto">Acheter · ${p.auto} ⭐</button></article>`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy))}function update(points){balance+=points;total+=points;const next=Math.floor(total/100)+1;if(next>level){level=next;document.querySelector('#msg').textContent=`Niveau ${level} atteint ! Bonus de niveau : ${level*5} ⭐`;balance+=level*5;total+=level*5}render();clearTimeout(saveTimer);saveTimer=setTimeout(report,1200)}function buy(which){const p=prices(),cost=p[which];if(balance<cost){document.querySelector('#msg').textContent='Pas assez d’étoiles pour cette amélioration.';return}balance-=cost;if(which==='click'){clickLevel++;clickPower++}else{autoLevel++;passive++}document.querySelector('#msg').textContent='Amélioration achetée !';render()}function report(){if(total>0)parent.postMessage({type:'el-game-score',game:'clicker',score:Math.min(total,1000000)},location.origin)}document.querySelector('#tap').onclick=()=>update(clickPower);document.querySelector('#reset').onclick=()=>{report();total=balance=0;clickPower=1;passive=level=clickLevel=autoLevel=0;level=1;render();document.querySelector('#msg').textContent='Nouvelle partie !'};setInterval(()=>{if(passive)update(passive)},1000);render();
</script></body></html>
