<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;background:#10152d;color:white;font:18px Arial;text-align:center;padding:20px"><h2>SPACE CLICKER</h2><p>Collecte des étoiles pour ton vaisseau.</p><h1 id="score" style="font-size:48px">0 ⭐</h1><button id="tap" style="font-size:70px;width:190px;height:190px;border-radius:50%;background:linear-gradient(140deg,#9c7aff,#ee75c1);border:0">🚀</button><p>Clique sur le vaisseau !</p><button onclick="reset()">Recommencer</button><script>
let n=0;const scoreDisplay=document.getElementById('score');let saveTimer;
function reportScore(){if(n>0)window.parent.postMessage({type:'el-game-score',game:'clicker',score:n},'*')}
document.getElementById('tap').onclick=()=>{n++;scoreDisplay.textContent=n+' ⭐';clearTimeout(saveTimer);saveTimer=setTimeout(reportScore,900)};
function reset(){clearTimeout(saveTimer);reportScore();n=0;scoreDisplay.textContent='0 ⭐'}
</script></body></html>
