<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#121212">
<title>RNG — EL GAME</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121212;color:#fff;font-family:Arial,sans-serif}.app{max-width:480px;height:100dvh;margin:auto;display:flex;flex-direction:column}.top{padding:10px 12px 4px}.stats{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.box{font-size:12px;font-weight:bold;border-radius:5px;padding:7px 9px}.luck{background:#2ecc71;color:#111}.speed{background:#3498db}.coins{background:#f1c40f;color:#111}.extra{text-align:center;color:#aaa;font-size:11px;margin-top:6px}.main{position:relative;flex:1;min-height:320px}.roulette{position:absolute;left:3%;top:10%;width:94%;height:72%;border:2px solid #2896f0;border-radius:12px;background:#1e1e1e;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:18px;font-weight:bold}.bottom{padding:8px}.roll{width:100%;height:68px;border:0;border-radius:8px;background:#2896f0;color:#fff;font-size:24px;font-weight:bold}.roll:disabled{opacity:.6}.auto{display:block;margin:6px auto 8px;width:70%;padding:8px;border:0;border-radius:6px;background:#262626;color:#aaa}.menus{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.menus button{padding:10px 4px;border:1px solid #444;border-radius:6px;background:#1e1e1e;color:#fff;font-weight:bold}.overlay{position:absolute;z-index:20;inset:0;background:#141414;display:flex;flex-direction:column}.overlay.hidden{display:none}.overlay h2{text-align:center;margin:12px}.close{position:absolute;right:12px;top:10px;width:48px;height:38px;border:0;border-radius:6px;background:#e74c3c;color:#fff;font-size:18px}.list{overflow:auto;padding:8px 12px 80px}.card{background:#1f1f1f;border:1px solid #333;border-radius:8px;margin:6px 0;padding:8px;text-align:center}.card button{width:100%;margin-top:6px;padding:8px;border:0;border-radius:5px;background:#2980b9;color:#fff;font-weight:bold}.slots{display:flex;flex-direction:column;gap:12px;padding:30px}.slot{padding:18px;border:1px solid #444;border-radius:8px;background:#1f1f1f;color:#fff;font-weight:bold}.cutscene{position:absolute;z-index:30;inset:0;background:#050505;display:flex;align-items:center;justify-content:center;text-align:center;font-size:32px;font-weight:bold}.cutscene.hidden{display:none}@media(max-height:600px){.roulette{top:5%;height:66%}.roll{height:58px}.menus button{padding:7px 4px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="stats"><div class="box luck" id="luck">Luck: x1.0</div><div class="box speed" id="speed">Speed: x1.0</div><div class="box coins" id="coins">Coins: 0</div></div><div class="extra"><span id="rolls">Rolls: 0</span> &nbsp; <span id="time">Temps: 00:00</span></div></div>
  <div class="main"><div class="roulette" id="roulette">Appuie sur ROLL</div><div class="cutscene hidden" id="cutscene"></div><div class="overlay hidden" id="overlay"><h2 id="overlayTitle"></h2><button class="close" id="close">X</button><div class="list" id="list"></div></div></div>
  <div class="bottom"><button class="roll" id="roll">ROLL</button><button class="auto" id="auto">AUTO ROLL : OFF</button><div class="menus"><button data-menu="shop">Shop</button><button data-menu="index">Index</button><button data-menu="quests">Quêtes</button><button data-menu="history">Historique</button><button data-menu="pets">Pets</button><button data-menu="settings">Options</button></div></div>
</div>
<script>
const AURAS={"Olive":3,"Expérimental":5,"Mint":8,"Laser":10,"No":15,"Streak":21,"Nani":22,"Upgraded Olive":33,"Ko":44,"Hunt Down":55,"Crash":59,"Troll":69,"Fortune":78,"Mega upgrader olive":83,"Autobotique":100,"Everything":115,"Robotic":150,"Mind Attack":222,"Killstreak":350,"Tungsten men":450,"Négatif":480,"Mandala":500,"Titan":600,"Banshee":666,"Demon":666,"Elemental force":750,"Godly":777,"Aurora":835,"Mystery":1000,"Brutality":1500,"Black":1750,"D E A T H":1666,"Double Ity":2500,"Nuclear assaut":2666,"Fatality":3000,"Darkness":4444,"RUPTURE":5000,"BUSTED":6666,"Night":8888,"BIG BANG":10000,"Azote":20000,"Gemini":30000,"Blood":25000,"End destroyer":50000,"Soul":100000,"Hacker":101100,"Blood moon":300000,"Tear of death":1666666,"Daylight":3000000,"Zodiac":7500000,"Glitch":1000000,"Olive god":10000000,"Corrupted":666666,"Horizon":674,"Nebula":1235,"Abyss":350,"Eclipse":2000,"Cataclysm":275666,"Thunderbolt":50,"Tsunami":300,"Hurricane":240,"Plasma":99999,"Dirt":17,"Cut":45,"Ultrapunch":25,"Drunk":33,"Poor":99,"Flying":140,"Leviating":280,"Speedo":300,"Rage extreme":400,"Ultra olive":499,"Prime olive":900,"Rich":999,"Asteroid":759,"Entity":9999};
const LUCK=[.5,1,2,5,10,20,50,100,250,500,1000,2500,5000,10000].map((v,i)=>({id:i+1,type:'luck',boost:v,price:[10,25,60,150,400,1000,2500,5000,12000,25000,60000,150000,400000,1000000][i],owned:false,equipped:false}));
const SPEED=[1.5,2,3.5,6,10,15,25,50].map((v,i)=>({id:i+11,type:'speed',speed_mult:v,price:[500,2000,6000,12000,25000,75000,200000,600000][i],owned:false,equipped:false,name:`Vitesse ${i+1} (x${v})`}));
const PETS=[{id:101,name:'Petit Robot',type:'coins',bonus:5,price:300,owned:false,equipped:false},{id:102,name:'Chaton Mystique',type:'luck',bonus:.5,price:1000,owned:false,equipped:false},{id:103,name:'Dragonnet',type:'speed',bonus:.5,price:3000,owned:false,equipped:false},{id:104,name:'Lutin Fortune',type:'coins',bonus:25,price:7500,owned:false,equipped:false},{id:105,name:'Renard Astral',type:'luck',bonus:2,price:15000,owned:false,equipped:false},{id:106,name:'Phénix Céleste',type:'speed',bonus:1.5,price:25000,owned:false,equipped:false},{id:107,name:'Golem Doré',type:'coins',bonus:100,price:50000,owned:false,equipped:false},{id:108,name:'Esprit Divin',type:'luck',bonus:10,price:100000,owned:false,equipped:false},{id:109,name:'Chrono-Cyber',type:'speed',bonus:3,price:180000,owned:false,equipped:false},{id:110,name:'Dragon Noir Cosmique',type:'luck',bonus:50,price:500000,owned:false,equipped:false}];
const shop=[...LUCK,...SPEED];let slot=1,coins=0,rolls=0,playTime=0,rolling=false,auto=false,luck=1,speed=1,unlocked=new Set(),history=[],quests=[],tempLuck=0,tempSpeed=0,tempUntil=0;
const $=id=>document.getElementById(id);const key=()=>`el-game-rng-slot-${slot}`;
function load(){try{const d=JSON.parse(localStorage.getItem(key())||'{}');coins=d.coins||0;rolls=d.rolls||0;playTime=d.playTime||0;unlocked=new Set(d.unlocked||[]);history=d.history||[];(d.shop||[]).forEach(x=>{const i=shop.find(y=>y.id===x.id);if(i){i.owned=x.owned;i.equipped=x.equipped}});(d.pets||[]).forEach(x=>{const i=PETS.find(y=>y.id===x.id);if(i){i.owned=x.owned;i.equipped=x.equipped}})}catch(e){}generateQuests(false);recalc();update()}
function save(){localStorage.setItem(key(),JSON.stringify({coins,rolls,playTime,unlocked:[...unlocked],history,shop:shop.map(x=>({id:x.id,owned:x.owned,equipped:x.equipped})),pets:PETS.map(x=>({id:x.id,owned:x.owned,equipped:x.equipped}))}))}
function recalc(){const li=shop.find(x=>x.type==='luck'&&x.equipped),si=shop.find(x=>x.type==='speed'&&x.equipped);luck=1+(li?.boost||0)+PETS.reduce((n,p)=>n+(p.owned&&p.equipped&&p.type==='luck'?p.bonus:0),0)+tempLuck;speed=(si?.speed_mult||1)+PETS.reduce((n,p)=>n+(p.owned&&p.equipped&&p.type==='speed'?p.bonus:0),0)+tempSpeed;$('luck').textContent=`Luck: x${luck.toFixed(1)}`;$('speed').textContent=`Speed: x${speed.toFixed(1)}`}
function update(){$('coins').textContent=`Coins: ${coins}`;$('rolls').textContent=`Rolls: ${rolls}`}
function color(chance){if(chance<100)return'#fff';if(chance<500)return'#2ecc71';if(chance<1000)return'#f1c40f';if(chance<10000)return'#e74c3c';if(chance<100000)return'#9b59b6';if(chance<1000000)return'#d35400';return'#ffdf00'}
function calculate(){const entries=Object.entries(AURAS).sort((a,b)=>b[1]-a[1]);for(const [name,d] of entries)if(Math.random()<=1/d*luck)return name;return'Olive'}
function roll(){if(rolling)return;rolling=true;$('roll').disabled=true;$('roll').textContent='Rolling...';let n=0;const timer=setInterval(()=>{n++;const names=Object.keys(AURAS),name=names[Math.floor(Math.random()*names.length)],chance=AURAS[name];$('roulette').textContent=`${name} - 1/${chance}`;$('roulette').style.color=color(chance);if(n>=16){clearInterval(timer);finish()}},Math.max(20,45/speed))}
function finish(){const name=calculate(),chance=AURAS[name];unlocked.add(name);rolls++;const earned=Math.max(0,Math.floor(chance/10))+PETS.reduce((n,p)=>n+(p.owned&&p.equipped&&p.type==='coins'?p.bonus:0),0);coins+=earned;history.unshift({name,chance,roll:rolls});history=history.slice(0,30);quests.forEach(q=>{if(q.completed)return;if(q.type==='rolls')q.progress++;if(q.type==='coins')q.progress+=earned;if(q.progress>=q.target)q.completed=true});save();update();$('roulette').style.color=color(chance);$('roulette').textContent=`${name} - 1/${chance}`;if(chance>=1000){$('cutscene').textContent=name;$('cutscene').classList.remove('hidden');$('cutscene').style.color=color(chance);setTimeout(()=>{$('cutscene').classList.add('hidden');reset()},700)}else reset();if(window.parent!==window)parent.postMessage({type:'el-game-score',game:'rng',score:rolls},location.origin)}
function reset(){setTimeout(()=>{$('roll').disabled=false;$('roll').textContent='ROLL';rolling=false;if(auto)roll()},400/speed)}
function open(name){$('overlay').classList.remove('hidden');const titles={shop:'BOUTIQUE',index:'INDEX DES AURAS',quests:'QUÊTES',history:'HISTORIQUE',pets:'BOUTIQUE DE PETS',settings:'OPTIONS'};$('overlayTitle').textContent=titles[name];const list=$('list');list.innerHTML='';if(name==='shop')renderShop(list);if(name==='index')renderIndex(list);if(name==='history')renderHistory(list);if(name==='pets')renderPets(list);if(name==='quests')renderQuests(list);if(name==='settings')renderSettings(list)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function card(html){return`<div class="card">${html}</div>`}
function renderShop(l){l.innerHTML=card(`<b>Solde : ${coins} Coins</b>`)+card('<b>Luck</b>'+shop.filter(x=>x.type==='luck').map(x=>`<div style="margin-top:8px"><span>+${x.boost} Luck</span><button onclick="buyShop(${x.id})">${x.owned?(x.equipped?'EQUIPE':'EQUIPER'): 'Acheter '+x.price+' C'}</button></div>`).join(''))+card('<b>Vitesse</b>'+shop.filter(x=>x.type==='speed').map(x=>`<div style="margin-top:8px"><span>${esc(x.name)}</span><button onclick="buyShop(${x.id})">${x.owned?(x.equipped?'EQUIPE':'EQUIPER'): 'Acheter '+x.price+' C'}</button></div>`).join(''))}
function buyShop(id){const x=shop.find(y=>y.id===id);if(!x.owned){if(coins<x.price)return;coins-=x.price;x.owned=true}shop.filter(y=>y.type===x.type).forEach(y=>y.equipped=false);x.equipped=!x.equipped;if(!x.owned)x.equipped=false;save();recalc();update();open('shop')}
function renderIndex(l){l.innerHTML=Object.entries(AURAS).sort((a,b)=>a[1]-b[1]).map(([n,c])=>card(`<span style="color:${unlocked.has(n)?color(c):'#555'}">${unlocked.has(n)?esc(n):'???'} — 1/${c}</span>`)).join('')}
function renderHistory(l){l.innerHTML=history.length?history.map(x=>card(`<span style="color:${color(x.chance)}">Roll #${x.roll} : ${esc(x.name)} (1/${x.chance})</span>`)).join(''):card('Aucun roll effectué')}
function renderPets(l){l.innerHTML=PETS.map(p=>card(`<b>${esc(p.name)}</b><br>Bonus : ${p.type} +${p.bonus}<button onclick="buyPet(${p.id})">${p.owned?(p.equipped?'EQUIPE':'EQUIPER'):'Acheter '+p.price+' C'}</button>`)).join('')}
function buyPet(id){const p=PETS.find(x=>x.id===id);if(!p.owned){if(coins<p.price)return;coins-=p.price;p.owned=true;p.equipped=true}else p.equipped=!p.equipped;save();recalc();update();open('pets')}
function generateQuests(saved=true){if(saved)return;quests=[{desc:'Effectuer 20 rolls',type:'rolls',target:20,progress:0,reward:'coins',val:50,completed:false,claimed:false},{desc:'Gagner 200 coins',type:'coins',target:200,progress:0,reward:'coins',val:80,completed:false,claimed:false},{desc:'Effectuer 15 rolls',type:'rolls',target:15,progress:0,reward:'luck',val:5,completed:false,claimed:false}]}
function renderQuests(l){l.innerHTML=quests.map((q,i)=>card(`<b>${esc(q.desc)}</b><br>${q.completed?'Terminée !':'Progression '+q.progress+' / '+q.target}${q.completed&&!q.claimed?'<button onclick="claimQuest('+i+')">CLAIM</button>':''}${q.claimed?'<br><b>RÉCOMPENSÉ</b>':''}`)).join('')}
function claimQuest(i){const q=quests[i];if(!q.completed||q.claimed)return;q.claimed=true;if(q.reward==='coins')coins+=q.val;if(q.reward==='luck'){tempLuck=q.val;tempUntil=Date.now()+60000}save();recalc();update();open('quests')}
function renderSettings(l){l.innerHTML=card('<b>Changer de partie</b><button onclick="showSlots()">RETOURNER AU MENU DES SLOTS</button>')}
function showSlots(){save();$('overlay').classList.add('hidden');const r=$('roulette');r.innerHTML='<div class="slots"><button class="slot" onclick="chooseSlot(1)">Partie 1</button><button class="slot" onclick="chooseSlot(2)">Partie 2</button><button class="slot" onclick="chooseSlot(3)">Partie 3</button></div>';r.style.display='block';$('roll').disabled=true}
function chooseSlot(n){slot=n;coins=rolls=0;unlocked=new Set();history=[];shop.forEach(x=>{x.owned=false;x.equipped=false});PETS.forEach(p=>{p.owned=false;p.equipped=false});$('roll').disabled=false;$('roulette').style.display='flex';$('roulette').textContent='Appuie sur ROLL';load()}
$('roll').onclick=roll;$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'AUTO ROLL : ON':'AUTO ROLL : OFF';$('auto').style.background=auto?'#e67e22':'#262626';if(auto&&!rolling)roll()};$('close').onclick=()=>$('overlay').classList.add('hidden');document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>open(b.dataset.menu));setInterval(()=>{if(Date.now()<tempUntil)return;if(tempLuck||tempSpeed){tempLuck=tempSpeed=0;recalc()}},1000);setInterval(()=>{playTime++;const m=Math.floor(playTime/60),s=playTime%60;$('time').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;save()},1000);showSlots();
</script>
</body>
</html>
