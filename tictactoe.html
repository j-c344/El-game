<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tic-Tac-Toe Online — EL GAME</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#10202a;color:white;font:16px Arial;text-align:center}h2{margin:4px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px auto}.controls input{width:150px;padding:11px;border-radius:9px;border:1px solid #579dc0;background:#142f3e;color:white;font-size:16px}.controls button,button{min-height:44px;padding:10px 14px;border:1px solid #5cc6e8;border-radius:10px;background:#1d526c;color:white;font-size:15px;touch-action:manipulation}.board{width:min(90vw,360px);margin:16px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{aspect-ratio:1;font-size:clamp(38px,16vw,70px);background:#173748;border:1px solid #3782a0;border-radius:12px;color:#fff}.status{min-height:24px;color:#aeeaff}.note{max-width:500px;margin:10px auto;color:#a6bdc8;font-size:13px;line-height:1.5}</style></head><body><h2>❎ TIC-TAC-TOE</h2><p>En ligne ou à deux sur le même appareil</p><div class="controls"><button id="local">Deux joueurs ici</button><input id="room" maxlength="12" placeholder="Code salon"><button id="join">Créer / rejoindre</button></div><p id="status" class="status" aria-live="polite">Choisis un mode pour commencer.</p><div class="board" id="board"></div><button id="restart">Nouvelle partie locale</button><p class="note">Le mode en ligne utilise Supabase Realtime Broadcast et nécessite que Realtime soit activé. Les codes de salon sont publics : ne les utilise pas comme des secrets.</p><script>
const URL='https://xlfbnulmyfoigrpgbzly.supabase.co',KEY='sb_publishable_mJ_6TwJbmHB_h7ozTAykXA_k6VBIl2o';let cells=Array(9).fill(''),turn='X',mode='local',channel=null,room='';const board=document.querySelector('#board'),status=document.querySelector('#status');function render(){board.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=v;b.setAttribute('aria-label',`Case ${i+1} ${v||'vide'}`);b.onclick=()=>play(i);board.appendChild(b)})}function winner(){for(const [a,b,c] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[c])return cells[a];return cells.every(Boolean)?'draw':null}function play(i,remote=false){if(cells[i]||winner())return;cells[i]=turn;turn=turn==='X'?'O':'X';render();const result=winner();status.textContent=result?(result==='draw'?'Match nul !':`${result} gagne !`):`Au tour de ${turn}`;if(mode==='online'&&!remote&&channel)channel.send({type:'broadcast',event:'move',payload:{cells,turn}})}function connect(){const client=window.supabase?.createClient(URL,KEY);if(!client){status.textContent='La connexion Supabase n’est pas disponible.';return}room=document.querySelector('#room').value.trim().toUpperCase()||Math.random().toString(36).slice(2,9).toUpperCase();document.querySelector('#room').value=room;mode='online';cells=Array(9).fill('');turn='X';if(channel)client.removeChannel(channel);channel=client.channel(`tic-tac-toe-${room}`).on('broadcast',{event:'move'},({payload})=>{if(Array.isArray(payload?.cells)&&payload.cells.length===9&&payload.cells.every(v=>['','X','O'].includes(v))){cells=payload.cells;turn=payload.turn==='X'?'X':'O';render();const result=winner();status.textContent=result?(result==='draw'?'Match nul !':`${result} gagne !`):`Salon ${room} · au tour de ${turn}`}}).subscribe(s=>{if(s==='SUBSCRIBED')status.textContent=`Salon ${room} prêt — partage le code avec un ami.`;else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT')status.textContent='Connexion impossible. Vérifie Supabase Realtime et réessaie.'});render()}function local(){if(channel){const c=window.supabase?.createClient(URL,KEY);c?.removeChannel(channel);channel=null}mode='local';cells=Array(9).fill('');turn='X';status.textContent='Mode local · au tour de X';render()}document.querySelector('#local').onclick=local;document.querySelector('#join').onclick=connect;document.querySelector('#restart').onclick=local;render();
</script></body></html>
