<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;background:#1d130e;color:white;font:16px Arial;text-align:center"><h2>POCKET PONG</h2><p>Déplace ta raquette avec la souris ou ton doigt.</p><canvas id="c" width="360" height="480" style="width:min(90vw,360px);background:#100d0b;border:2px solid #f0a45d;touch-action:none"></canvas><p id="score">Score : 0</p><script>let c=document.getElementById('c'),x=c.getContext('2d'),p=145,b={x:180,y:240,dx:3,dy:4},s=0,over=false;function move(e){let r=c.getBoundingClientRect();p=(e.clientX-r.left)*360/r.width-40;p=Math.max(0,Math.min(280,p))}c.onmousemove=move;c.ontouchmove=e=>{move(e.touches[0]);e.preventDefault()};function loop(){x.clearRect(0,0,360,480);x.fillStyle='#f0a45d';x.fillRect(p,450,80,12);x.beginPath();x.arc(b.x,b.y,9,0,7);x.fill();if(!over){b.x+=b.dx;b.y+=b.dy;if(b.x<9||b.x>351)b.dx*=-1;if(b.y<9)b.dy*=-1;if(b.y>440&&b.x>p&&b.x<p+80){b.dy=-Math.abs(b.dy);s++;document.getElementById('score').textContent='Score : '+s}if(b.y>480)over=true}else{x.fillStyle='white';x.font='24px Arial';x.fillText('Partie terminée',90,230);x.font='15px Arial';x.fillText('Actualise pour rejouer',112,260)}requestAnimationFrame(loop)}loop();</script></body></html>
