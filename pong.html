<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Pong — EL GAME</title><style>*{box-sizing:border-box}body{margin:0;padding:10px;background:#1d130e;color:white;font:16px Arial;text-align:center;touch-action:manipulation}h2{margin:5px}.hud{display:flex;justify-content:center;gap:20px;color:#ffd2a8}canvas{display:block;width:min(94vw,420px);height:auto;max-height:70vh;margin:10px auto;background:#321f15;border:2px solid #f0a45d;border-radius:10px;touch-action:none}button{min-height:44px;padding:10px 18px;background:#683c20;border:1px solid #f0a45d;border-radius:10px;color:white;font-size:16px}</style></head><body><h2>🏓 POCKET PONG</h2><div class="hud"><span id="score">Score : 0</span><span id="level">Niveau 1</span></div><canvas id="c" width="360" height="480" aria-label="Pong, déplace la raquette avec le doigt ou la souris"></canvas><p id="msg">Déplace ta raquette pour commencer.</p><button id="restart">Recommencer</button><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');let paddle=140,ball={x:180,y:220,dx:3,dy:4},score=0,level=1,running=true,ended=false;function paint(){ctx.clearRect(0,0,360,480);ctx.fillStyle='#321f15';ctx.fillRect(0,0,360,480);ctx.fillStyle='#f0a45d';ctx.fillRect(paddle,450,80,12);ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,Math.PI*2);ctx.fillStyle='#fff0cc';ctx.fill();ctx.strokeStyle='#8c5a36';ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(180,0);ctx.lineTo(180,440);ctx.stroke();ctx.setLineDash([])}function move(e){const rect=c.getBoundingClientRect(),clientX=e.clientX??e.touches?.[0]?.clientX;if(clientX==null)return;paddle=Math.max(0,Math.min(280,(clientX-rect.left)*360/rect.width-40))}c.addEventListener('pointermove',move);c.addEventListener('pointerdown',move);function loop(){if(!running)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<9||ball.x>351)ball.dx*=-1;if(ball.y<9)ball.dy=Math.abs(ball.dy);if(ball.y+9>=450&&ball.y<465&&ball.x>=paddle&&ball.x<=paddle+80){ball.y=440;ball.dy=-Math.abs(ball.dy)*1.025;ball.dx+=(ball.x-(paddle+40))*.06;score++;const next=Math.floor(score/5)+1;if(next>level){level=next;document.querySelector('#level').textContent=`Niveau ${level}`}document.querySelector('#score').textContent=`Score : ${score}`}if(ball.y>490){running=false;ended=true;document.querySelector('#msg').textContent='Fin de partie ! Appuie sur recommencer.';if(score)parent.postMessage({type:'el-game-score',game:'pong',score},location.origin)}paint();if(running)requestAnimationFrame(loop)}function start(){score=0;level=1;paddle=140;ball={x:180,y:220,dx:3,dy:4};running=true;ended=false;document.querySelector('#score').textContent='Score : 0';document.querySelector('#level').textContent='Niveau 1';document.querySelector('#msg').textContent='Glisse le doigt ou la souris pour déplacer la raquette.';loop()}document.querySelector('#restart').onclick=start;paint();loop();
</script></body></html>
